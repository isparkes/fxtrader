services:
  fxtrader:
    image: ${FXTRADER_IMAGE}
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"   # control console — localhost only
    volumes:
      - /data/fxtrader/fx_trades.jsonl:/app/trades.jsonl
      - /data/fxtrader/fxtrader.log:/app/fxtrader.log
    # Override CMD to pass flags, e.g.:
    #   command: ["--live"]                                  # enable Oanda order execution
    #   command: ["--dry-run"]                               # log only, no emails or orders
    #   command: ["--live", "--pair", "eurusd", "--interval", "60"]
    #   command: ["--log-level", "DEBUG"]

  cryptotrader:
    image: ${CRYPTOTRADER_IMAGE}
    env_file: .env
    restart: unless-stopped
    volumes:
      - /data/fxtrader/crypto_trades.jsonl:/app/trades.jsonl
      - /data/fxtrader/cryptotrader.log:/app/cryptotrader.log
    # Override CMD to pass flags, e.g.:
    #   command: ["--live"]                                  # enable Binance order execution
    #   command: ["--dry-run"]                               # log only, no emails or orders
    #   command: ["--live", "--interval", "60"]
    #   command: ["--log-level", "DEBUG"]

