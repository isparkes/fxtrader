services:
  fxtrader:
    image: ${FXTRADER_IMAGE}
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:9876:9876"   # control console — localhost only
    volumes:
      - /Users/iansparkes/Data/Projects/fxtrader/fx_trades.jsonl:/app/fx_trades.jsonl
      - /Users/iansparkes/Data/Projects/fxtrader/fxtrader.log:/app/fxtrader.log
      - /Users/iansparkes/Data/Projects/fxtrader/data/oanda:/app/data/oanda   # persistent OANDA parquet store
    # Override CMD to pass flags, e.g.:
    #   command: ["--live"]                                       # enable OANDA order execution
    #   command: ["--dry-run"]                                    # log only, no emails or orders
    #   command: ["--live", "--occult-stops"]                     # hide SL/TP from broker
    #   command: ["--live", "--pair", "eurusd", "usdjpy"]         # trade specific pairs
    #   command: ["--log-level", "DEBUG"]
    # Or set FX_PAIRS=eurusd,usdjpy,audusd in .env to select pairs without rebuilding the image.
